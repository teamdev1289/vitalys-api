version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vitalys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitalys_db
      POSTGRES_USER: vitalys
      POSTGRES_PASSWORD: vitalys_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalys -d vitalys_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
